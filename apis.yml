apis:
  - aid: walnut:walnut-api
    name: Walnut Customer Data API
    description: Read-only REST API for Walnut demo analytics. Two data endpoints plus a health check — GET /demo-sessions returns individual demo-session records across 29 documented fields with filtering, offset pagination, comma-separated field selection and multi-dimensional group_by aggregation, and GET /demo-sessions/summary returns a pre-built snapshot of totals, averages, top demos and top countries. Authenticated with a static x-api-key header issued by a Walnut account representative. Available on the Scale (enterprise) plan only. Walnut publishes no OpenAPI document for it.
