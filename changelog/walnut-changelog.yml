name: Walnut Product Updates
description: >-
  Walnut publishes a dated, public release-notes stream in its knowledge base — roughly monthly
  since March 2021, with occasional mid-month posts, and machine-readable through the knowledge
  base catalog at help.walnut.io/api/v1/docs.json. It is a PRODUCT changelog: it records
  application features shipped, not API contract changes. Nothing in the recent window announces
  or deprecates a Customer Data API endpoint, field, or behaviour, so an API consumer gets no
  change signal from it.
