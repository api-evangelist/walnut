name: Walnut Well-Known Probe
description: >-
  Probe of the RFC 8615 /.well-known/ namespace across every Walnut host named in apis.yml
  and in the published API documentation. No host serves a real well-known document. The only
  200 responses came from app.teamwalnut.com, whose single-page-application catch-all returns
  the app's HTML shell for every unknown path — those are recorded as misses, not documents,
  and no WellKnown or SecurityTxt pointer is emitted from this probe.
generated: '2026-08-13'
method: probed
source: live HTTPS probes of /.well-known/* on all Walnut hosts
checked: '2026-08-13'
hosts:
  - host: www.walnut.io
    note: Marketing site (WordPress). All paths 404 with the site's HTML 404 page.
  - host: help.walnut.io
    note: Knowledge base (Docusaurus). All paths 404 with the docs 404 page.
  - host: app.teamwalnut.com
    note: >-
      Walnut application. Static-asset paths 404 with an S3 NoSuchKey document; unmatched
      routes return HTTP 200 carrying the SPA HTML shell. Every 200 below is that shell,
      not a well-known document.
  - host: customer-api.teamwalnut.com
    note: >-
      Customer Data API (AWS API Gateway). Unmatched paths answer 403
      {"message":"Missing Authentication Token"} — API Gateway's not-found response.
  - host: api.teamwalnut.com
    note: Internal application API (Phoenix/Elixir). All paths 404 {"errors":{"detail":"Not Found"}}.
