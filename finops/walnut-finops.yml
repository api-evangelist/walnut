name: Walnut FinOps
description: >-
  Cost model for consuming Walnut, and specifically for consuming its API. Walnut sells seats on
  annual contracts, not API calls: there is no metered API pricing, no per-request rate, no
  quota-and-overage schedule, and no published price for the only tier that includes API access.
  The whole cost of reaching the Customer Data API is therefore the cost of a Scale contract,
  which is quoted rather than listed.
url: https://www.walnut.io/pricing
generated: '2026-08-13'
method: searched
source: https://www.walnut.io/pricing
created: '2026-06-13'
modified: '2026-08-13'

summary:
  model: Seat-based SaaS subscription with annual contracts
  api_pricing_model: none — API access is a contract entitlement, not a metered line item
  apiAccess: Scale (enterprise) plan only, custom pricing
  billingCycle: Annual
  self_service_purchase: false
  entry_price: $575/month billed annually (Ignite, no API access)
  cheapest_api_bearing_plan: Scale — price not published
  pricingTransparency: >-
    Partial and inverted for developers. The two tiers WITHOUT the API carry list prices; the one
    tier WITH the API does not, so an integrator cannot cost an integration from public
    information.

plans:
  - name: Ignite
    monthlyRate: $575
    annualCost: $6,900
    seats: 3 Editor + 3 Presenter
    aiCredits: 50000
    apiAccess: false
    costPerSeat: ~$96/month across 6 seats
  - name: Accelerate
    monthlyRate: $1,550
    annualCost: $18,600
    seats: 6 Editor + 6 Presenter
    aiCredits: 100000
    apiAccess: false
    costPerSeat: ~$129/month across 12 seats
  - name: Scale
    monthlyRate: Custom
    annualCost: Custom
    seats: Custom
    aiCredits: 200000
    apiAccess: true
    notes: >-
      Demos API and MCP access are exclusive to this tier. Contact sales for pricing.

api_cost_drivers:
  - driver: Plan tier
    note: >-
      The only true gate. Moving from Accelerate to Scale is the entire cost of API access; there
      is no lighter way to buy it.
  - driver: Rate limits, not price
    note: >-
      Usage is constrained by throughput (50 req/s sustained, 100 burst, 1,000 rows per request)
      rather than by billing. Heavy extraction costs time, not money. Walnut directs customers to
      their account representative for rate-limit changes, so higher throughput is a negotiation.
  - driver: AI Credits
    note: >-
      50k / 100k / 200k per tier. A product entitlement for AI demo generation — it is not
      consumed by API calls, which are read-only analytics queries.
  - driver: Add-ons
    note: >-
      Offline demos, white labeling, advanced translations, video overlays, custom domains, SSO
      & SCIM, Digital Sales Rooms and sandbox demos are sold separately at some tiers.

costOptimization:
  - tip: >-
      Cost the API against what it actually returns before upgrading. The current surface is one
      read-only entity — demo sessions — and Walnut lists demo metadata, playlist sessions and
      admin analytics as not yet available. If webhooks already carry the session data you need,
      an Accelerate contract plus a webhook receiver may cover the use case without a Scale upgrade.
  - tip: >-
      Prefer GET /demo-sessions/summary over paging the full session list for dashboards. It
      returns seven aggregations in one request and avoids thousands of paged calls against the
      rate limit.
  - tip: >-
      Use group_by and the fields parameter. Aggregating server-side and selecting 5 of 29 fields
      cuts both response size and the number of requests needed.
  - tip: >-
      Seat count is the primary contract cost driver; audit active Editor and Presenter seats
      quarterly to avoid paying for unused seats.
  - tip: >-
      Negotiate rate limits, add-ons and multi-year terms in the same conversation as the Scale
      upgrade — all three are contract terms, none are self-service later.
  - tip: >-
      There is no self-service key rotation, so factor account-team turnaround into any incident
      plan that involves revoking a credential.

